name: Daily Scraper (UTC-3 at 23:00, Mon-Fri)

on:
  schedule:
    # 02:00 UTC, Tuesday through Saturday
    # which corresponds to 23:00 UTC-3, Monday through Friday
    - cron: '0 2 * * 2-6'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run scraper
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANBIMA_IRTS_HF_REPO_ID: rodrigomtorresb/anbima-irts
          ANBIMA_IRTS_HF_FILENAME: latest.parquet
          ANBIMA_IDKA_HF_REPO_ID: rodrigomtorresb/anbima-idka
          ANBIMA_IDKA_HF_FILENAME: latest.parquet
        run: |
          python auto_scrape.py
